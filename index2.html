<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Country Information System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: top bar with module tabs; Peta = registry panel + full-bleed vector world map; Sensor/Laporan/Perawatan = full-width work lists; a detail drawer slides over the right edge in every module. */
:root{
  --ground:#f4f6f5; --panel:#ffffff; --ink:#1b2a30; --muted:#5d6e74; --line:#dde4e3;
  --accent:#0f6d6a; --accent-ink:#ffffff; --accent-soft:#e1efed;
  --sea:#d6e3e6; --land:#eef1ec; --coast:#aebcbd; --grat:#c3d3d6;
  --tint1:#d9e9e2; --tint2:#bfdccf; --tint3:#9ccab7; --tint4:#76b49c;
  --c-bangunan:#3d5a98; --c-jalan:#c7831a; --c-jembatan:#0f8a84; --c-bendungan:#2b7fc2;
  --c-pelabuhan:#6b4fa3; --c-bandara:#a2459a; --c-energi:#cf4b2b; --c-lainnya:#6b7a80;
  --ok:#2e7d4f; --warn:#b7791f; --bad:#c0392b; --build:#4a6fa5; --crit:#8e1b3b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 10px 30px rgba(20,40,45,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0f1719; --panel:#152024; --ink:#e3ecec; --muted:#93a6aa; --line:#27363a;
  --accent:#4fbdb3; --accent-ink:#0b1a1a; --accent-soft:#1b3433;
  --sea:#0c1a20; --land:#1e2c2f; --coast:#3b5055; --grat:#16272d;
  --tint1:#1f3935; --tint2:#24493f; --tint3:#2b5d4d; --tint4:#357560;
  --c-bangunan:#7d9be0; --c-jalan:#e9a843; --c-jembatan:#3cc3b9; --c-bendungan:#5aaeee;
  --c-pelabuhan:#a78bdf; --c-bandara:#dc7fd2; --c-energi:#f07a5a; --c-lainnya:#9aa9ae;
  --ok:#5cc28a; --warn:#e3a849; --bad:#ef6b5d; --build:#86a8de; --crit:#ff7fa3;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f1719; --panel:#152024; --ink:#e3ecec; --muted:#93a6aa; --line:#27363a;
  --accent:#4fbdb3; --accent-ink:#0b1a1a; --accent-soft:#1b3433;
  --sea:#0c1a20; --land:#1e2c2f; --coast:#3b5055; --grat:#16272d;
  --tint1:#1f3935; --tint2:#24493f; --tint3:#2b5d4d; --tint4:#357560;
  --c-bangunan:#7d9be0; --c-jalan:#e9a843; --c-jembatan:#3cc3b9; --c-bendungan:#5aaeee;
  --c-pelabuhan:#a78bdf; --c-bandara:#dc7fd2; --c-energi:#f07a5a; --c-lainnya:#9aa9ae;
  --ok:#5cc28a; --warn:#e3a849; --bad:#ef6b5d; --build:#86a8de; --crit:#ff7fa3;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grow{flex:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-columns:minmax(320px,390px) 1fr;grid-template-rows:auto 1fr}
.app.full{grid-template-columns:1fr}
.app.full .side{display:none}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:10px 16px;padding-block:8px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em;line-height:1}
.brand .code{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:3px;padding:1px 5px;letter-spacing:.06em}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.nav button:hover{color:var(--ink);background:var(--ground)}
.nav button[aria-selected="true"]{color:var(--ink);background:var(--accent-soft)}
.badge{font-family:var(--f-mono);font-size:10.5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--line);color:var(--ink)}
.badge.hot{background:var(--bad);color:#fff}
.role{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 7px;white-space:nowrap}
.role.admin{color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-scroll{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column}
.sect{padding-block:14px;padding-inline:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.totals{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.totals .sub{color:var(--muted);font-size:12.5px}
.health{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hbtn{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.hbtn:hover{border-color:var(--muted)}
.hbtn b{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.hbtn span{font-size:11.5px;color:var(--muted);line-height:1.2}
.hbtn.hot{border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.hbtn.hot b{color:var(--bad)}
.cond-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.cond-bar span{display:block;height:100%}
.cond-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.cond-legend b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px 4px 9px;font-size:12.5px;cursor:pointer}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.dim{opacity:.55}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .full{grid-column:1/-1}
.in{width:100%;border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:7px 10px;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--ground)}
.row[aria-current="true"]{background:var(--accent-soft)}
.glyph{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#fff;margin-top:1px;flex:none}
.glyph svg{width:16px;height:16px}
.nm{font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.coord{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:3px}
.flag{color:var(--bad);font-size:11.5px;font-weight:600;margin-top:3px}
.pill{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid currentColor;display:inline-block}
.c-ok,.pill.baik,.pill.selesai{color:var(--ok)}
.c-warn,.pill.ringan,.pill.ditangani,.pill.sedang{color:var(--warn)}
.c-bad,.pill.berat,.pill.tinggi,.pill.alert{color:var(--bad)}
.pill.kritis{color:var(--crit)}
.pill.bangun,.pill.baru,.pill.terjadwal{color:var(--build)}
.pill.rendah,.pill.off,.pill.offline,.pill.nodata{color:var(--muted)}
.pill.solid.kritis{background:var(--crit);border-color:var(--crit);color:#fff}
.tag-ex{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.empty{padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{margin:0;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:600}
.empty p{margin:0;max-width:40ch}
.banner{position:absolute;top:12px;left:60px;right:12px;z-index:1150;background:var(--panel);border:1px solid var(--warn);border-left-width:4px;border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:var(--shadow);max-width:560px}
.notice{margin:0;padding-block:8px;padding-inline:16px;font-size:12.5px;background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line)}

.main{position:relative;min-height:0;min-width:0}
#map{position:absolute;inset:0}
.legend{position:absolute;left:12px;bottom:12px;z-index:900;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;display:grid;grid-template-columns:repeat(2,auto);gap:3px 14px;box-shadow:var(--shadow)}
.legend .al{grid-column:1/-1;border-top:1px solid var(--line);padding-top:4px;margin-top:2px;display:flex;align-items:center;gap:6px}
.ringdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--bad);display:inline-block}
.pickhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:950;background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.cursor{position:absolute;right:12px;bottom:12px;z-index:900;font-family:var(--f-mono);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--muted)}

.pane{position:absolute;inset:0;z-index:1100;background:var(--ground);overflow:auto}
.pane-in{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.pane-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pane-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1}
.pane-h p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tlist{list-style:none;margin:0;padding:0}
.trow{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding-block:11px;padding-inline:0 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--ground)}
.trow .stripe{align-self:stretch;margin-block:-11px;background:var(--line)}
.trow .stripe.rendah{background:var(--muted)} .trow .stripe.sedang{background:var(--warn)} .trow .stripe.tinggi{background:var(--bad)} .trow .stripe.kritis{background:var(--crit)}
.trow .stripe.late{background:var(--bad)} .trow .stripe.plan{background:var(--build)} .trow .stripe.done{background:var(--ok)}
.trow .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.trow .when{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sec-title{margin:8px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard.alert{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.scard .top{display:flex;gap:8px;align-items:flex-start}
.scard .ttl{flex:1;min-width:0}
.scard .ttl b{display:block;overflow-wrap:anywhere;line-height:1.25}
.scard .ttl small{color:var(--muted);font-size:11.5px}
.reading{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.reading .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.reading .u{color:var(--muted);font-weight:600}
.reading .t{color:var(--muted);font-size:11.5px;margin-left:auto}
.thr{font-size:11.5px;color:var(--muted)}
.spark{display:block;width:100%;height:56px}
.spark .band{fill:var(--accent-soft)}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .end{stroke:var(--accent);stroke-width:8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .end.al{stroke:var(--bad)}
.spark-cap{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);gap:8px}
.spark-empty{font-size:12px;color:var(--muted);padding:8px 0}
.cam{border-radius:6px;background:var(--ground);border:1px dashed var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.cam .url{font-family:var(--f-mono);font-size:11px;overflow-wrap:anywhere;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}

.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:min(420px,calc(100% - 24px));z-index:1200;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.drawer-h{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px 16px;border-bottom:1px solid var(--line)}
.hwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.drawer-h h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.x{border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:4px;color:var(--muted);font-size:20px;line-height:1}
.x:hover{background:var(--ground);color:var(--ink)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.drawer-b{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.drawer-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.coordbox{font-family:var(--f-mono);font-size:12px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.catline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--ground)}
.mini b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1}
.mini span{font-size:11.5px;color:var(--muted)}
.mini.hot b{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:var(--panel)}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--muted)}
.item .l1{display:flex;gap:8px;align-items:flex-start}
.item .l1 b{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.item .sub{font-size:12px;color:var(--muted)}
.item p{margin:0;font-size:13px;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.timeline .sub{font-size:12px;color:var(--muted)}
.timeline p{margin:3px 0 0;overflow-wrap:anywhere}
form.fm{display:flex;flex-direction:column;gap:11px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.help{font-size:11.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:12.5px;margin:0}
.pj-res{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.pj-res button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer}
.pj-res button:hover{border-color:var(--accent)}
.confirm{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.box{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.viewer{position:fixed;inset:0;z-index:2000;background:var(--ground);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer-h{display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.viewer-h .hwrap{flex:1}
.viewer-h h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.viewer-b{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden;touch-action:none}
.stage canvas{display:block;position:absolute;inset:0;width:100%!important;height:100%!important}
.vstatus{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);z-index:2}

function decodeRing(str,off,scale){const out=[];let px=off[0],py=off[1];for(let i=0;i<str.length;i+=2){let x=str.charCodeAt(i)-64,y=str.charCodeAt(i+1)-64;x=(x>>1)^(-(x&1));y=(y>>1)^(-(y&1));x+=px;y+=py;px=x;py=y;out.push([x/scale,y/scale]);}return out;}
function decodeWorld(geo){
  if(!geo||!geo.features)return null;
  if(!geo.UTF8Encoding)return geo;
  const sc=geo.UTF8Scale||1024;
  geo.features.forEach(f=>{const g=f.geometry;if(!g)return;const c=g.coordinates,eo=g.encodeOffsets;
    if(g.type==='Polygon'){for(let i=0;i<c.length;i++)if(typeof c[i]==='string')c[i]=decodeRing(c[i],eo[i],sc);}
    else if(g.type==='MultiPolygon'){for(let i=0;i<c.length;i++)for(let j=0;j<c[i].length;j++)if(typeof c[i][j]==='string')c[i][j]=decodeRing(c[i][j],eo[i][j],sc);}
  });
  geo.UTF8Encoding=false;
  geo.features.forEach(f=>{if(f)f.type='Feature';});
  const okRing=r=>Array.isArray(r)&&r.length>=3&&r.every(pt=>Array.isArray(pt)&&isFinite(pt[0])&&isFinite(pt[1])&&Math.abs(pt[1])<=90);
  geo.features=geo.features.filter(f=>{const g=f&&f.geometry;if(!g||!f.properties||!f.properties.name)return false;
    if(g.type==='Polygon'){g.coordinates=g.coordinates.filter(okRing);return g.coordinates.length>0;}
    if(g.type==='MultiPolygon'){g.coordinates=g.coordinates.map(p=>p.filter(okRing)).filter(p=>p.length>0);return g.coordinates.length>0;}
    return false;});
  return geo;
}

function inRing(pt,ring){let x=pt[0],y=pt[1],ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function inPoly(pt,poly){if(!inRing(pt,poly[0]))return false;for(let h=1;h<poly.length;h++)if(inRing(pt,poly[h]))return false;return true;}
function countryAt(lat,lng){if(!world)return '';const pt=[lng,lat];for(const f of world.features){const g=f.geometry;if(!g)continue;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const p of polys)if(inPoly(pt,p))return f.properties.name;}return '';}

/* ================= Sensor card ================= */
function spark(s){
  const h=(s.riwayat||[]).filter(p=>p&&isFinite(p.v));
  if(h.length<2)return '<div class="spark-empty">Grafik muncul setelah ada 2 pembacaan atau lebih.</div>';
  const vs=h.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const dlo=lo,dhi=hi;
  const mn=num(s.min),mx=num(s.max);
  if(mn!=null)lo=Math.min(lo,mn);if(mx!=null)hi=Math.max(hi,mx);
  if(hi===lo){hi+=1;lo-=1;}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const W=300,H=56,x=i=>i/(h.length-1)*W,y=v=>H-(v-lo)/(hi-lo)*H;
  let band='';
  if(mn!=null||mx!=null){const top=mx!=null?y(mx):0,bot=mn!=null?y(mn):H;band='<rect class="band" x="0" y="'+top.toFixed(1)+'" width="'+W+'" height="'+Math.max(0,bot-top).toFixed(1)+'"/>';}
  const pts=h.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const lx=x(h.length-1).toFixed(1),ly=y(h[h.length-1].v).toFixed(1);
  const al=sStat(s)==='alert';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Tren '+h.length+' pembacaan terakhir">'+band+'<polyline class="ln" points="'+pts+'"/><line class="end'+(al?' al':'')+'" x1="'+lx+'" y1="'+ly+'" x2="'+lx+'" y2="'+ly+'"/></svg>'+
    '<div class="spark-cap"><span>'+esc(fmtTime(h[0].t))+'</span><span>min '+fmtNum(dlo)+' · maks '+fmtNum(dhi)+'</span></div>';
}
function sensorCard(s,showAsset){
  const t=STYPE[s.tipe]||STYPE.lainnya,st=sStat(s);
  const unit=s.satuan||t.u;
  let body;
  if(t.cam){

    body='<div class="cam"><b>'+(st==='ok'?'Kamera daring':SSTAT[st])+'</b>'+(url?'<span class="url">'+esc(url)+'</span><a class="linkbtn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Buka siaran langsung ↗</a>':'<span class="help">Alamat siaran belum diisi.</span>')+'</div>';
  } else {
    const thr=[num(s.min)!=null?'min '+fmtNum(s.min):'',num(s.max)!=null?'maks '+fmtNum(s.max):''].filter(Boolean).join(' · ');
    body='<div class="reading"><span class="v'+(st==='alert'?' c-bad':'')+'">'+fmtNum(s.nilai)+'</span><span class="u">'+esc(unit)+'</span><span class="t">'+esc(ago(s.waktu))+'</span></div>'+
      (thr?'<div class="thr">Ambang normal: '+thr+' '+esc(unit)+'</div>':'')+spark(s);
  }
  const acts=[];
  if(S.admin&&!t.cam)acts.push('<button class="btn sm" type="button" data-act="reading" data-id="'+esc(s.id)+'">Catat pembacaan</button>');
  if(S.admin&&t.cam)acts.push('<button class="btn sm" type="button" data-act="cam-status" data-id="'+esc(s.id)+'">'+(s.status==='offline'?'Tandai daring':'Tandai offline')+'</button>');
  if(S.canReport&&(st==='alert'||st==='offline'))acts.push('<button class="btn sm" type="button" data-act="report-from-sensor" data-id="'+esc(s.id)+'">Laporkan gangguan</button>');
  if(S.admin)acts.push('<button class="btn sm" type="button" data-act="edit-sensor" data-id="'+esc(s.id)+'">Ubah</button>');
  return '<div class="scard'+(st==='alert'||st==='offline'?' alert':'')+'"><div class="top"><div class="ttl"><b>'+esc(s.nama)+(s.contoh?'<span class="tag-ex">contoh</span>':'')+'</b><small>'+esc(t.k==='lainnya'?(s.tipeLain||'Sensor'):t.n)+(s.posisi?' · '+esc(s.posisi):'')+'</small>'+(showAsset?'<div><button class="linkbtn" type="button" data-act="open-asset" data-id="'+esc(s.assetId)+'" data-tab="sensor">'+esc(assetName(s.assetId))+'</button></div>':'')+'</div><span class="pill '+st+'">'+SSTAT[st]+'</span></div>'+body+(acts.length?'<div class="acts">'+acts.join('')+'</div>':'')+'</div>';

    const list=S.reports.filter(r=>S.rf==='open'?isOpen(r):S.rf?r.status===S.rf:true).sort((a,b)=>(isOpen(b)-isOpen(a))||(PRANK[a.prioritas]-PRANK[b.prioritas])||String(b.dibuat).localeCompare(String(a.dibuat)));
    p.innerHTML='<div class="pane-in"><div class="pane-h"><div><h2>Laporan gangguan</h2><p>Laporan kerusakan atau gangguan pada aset. Pelapor mengirim laporan, admin aset menindaklanjuti sampai selesai.</p></div><span class="grow"></span>'+(S.canReport&&S.assets.length?'<button class="btn primary" type="button" data-act="add-report">+ Laporkan gangguan</button>':'')+'</div>'+
      '<div class="chips">'+[['open','Terbuka',cnt.open],['baru','Baru',cnt.baru],['ditangani','Ditangani',cnt.ditangani],['selesai','Selesai',cnt.selesai],['','Semua',S.reports.length]].map(([k,n,c])=>'<button class="chip" type="button" data-act="rf" data-f="'+k+'" aria-pressed="'+(S.rf===k)+'">'+n+' <span class="n">'+c+'</span></button>').join('')+'</div>'+
      (list.length?'<div class="card"><ul class="tlist">'+list.map(r=>reportRow(r,true)).join('')+'</ul></div>':'<div class="empty"><h3>Tidak ada laporan di sini</h3><p>'+(S.rf==='open'?'Semua gangguan sudah ditangani.':'Belum ada laporan dengan status ini.')+'</p></div>')+'</div>';
  } else if(S.view==='perawatan'){
    const late=S.maint.filter(isLate).sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
    const plan=S.maint.filter(m=>m.status==='terjadwal'&&!isLate(m)).sort((a,b)=>String(a.tanggal).localeCompare(String(b.tanggal)));
    const done=S.maint.filter(m=>m.status==='selesai').sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
    const cost=done.filter(m=>(m.tanggal||'').slice(0,4)===today().slice(0,4)).reduce((t,m)=>t+(num(m.biaya)||0),0);
    const sec=(t,arr,e)=>'<p class="sec-title">'+t+' <span class="badge">'+arr.length+'</span></p>'+(arr.length?'<div class="card"><ul class="tlist">'+arr.map(m=>maintRow(m,true)).join('')+'</ul></div>':'<p class="help">'+e+'</p>');

      sec('Terlambat',late,'Tidak ada perawatan yang terlambat.')+sec('Terjadwal',plan,'Belum ada perawatan terjadwal.')+sec('Riwayat selesai',done,'Belum ada perawatan yang selesai.')+'</div>';
  }
}

/* ================= Drawer ================= */
function head(title,pre){return '<div class="drawer-h">'+(S.D.back?'<button class="x" type="button" data-act="back" aria-label="Kembali">←</button>':'')+'<div class="hwrap">'+(pre||'')+'<h2>'+esc(title)+'</h2></div><button class="x" type="button" data-act="close" aria-label="Tutup">×</button></div>';}
function kv(k,v,raw){return (v===''||v==null)?'':'<dt>'+k+'</dt><dd>'+(raw?v:esc(v))+'</dd>';}
function field(f,d){
  const id='fm-'+f.n,v=d[f.n]==null?'':d[f.n];let c;
  if(f.t==='select')c='<select class="in" id="'+id+'" name="'+f.n+'">'+f.opts.map(([k,l])=>'<option value="'+esc(k)+'"'+(String(v)===String(k)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  else if(f.t==='textarea')c='<textarea class="in" id="'+id+'" name="'+f.n+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  else c='<input class="in" id="'+id+'" name="'+f.n+'" type="'+(f.t==='date'?'date':'text')+'"'+(f.t==='num'?' inputmode="decimal"':'')+(f.list?' list="'+f.list+'"':'')+' value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off">';
  return '<div class="fld"><label for="'+id+'">'+f.l+(f.req?' *':'')+'</label>'+c+(f.help?'<span class="help">'+f.help+'</span>':'')+'</div>';
}
function fields(list,d){return list.map(x=>Array.isArray(x)?'<div class="two">'+x.map(f=>field(f,d)).join('')+'</div>':typeof x==='string'?x:field(x,d)).join('');}
function formShell(title,inner,saveLabel,extraFoot){return head(title)+'<form class="fm drawer-b" id="fm" novalidate>'+inner+'<p class="err" id="fm-err" hidden></p></form><div class="drawer-f">'+(extraFoot||'')+'<span class="grow"></span><button class="btn" type="button" data-act="back">Batal</button><button class="btn primary" type="button" data-act="save">'+saveLabel+'</button></div>';}
function syncDraft(){const f=$('#fm');if(!f||!S.D||!S.D.draft)return;for(const el of f.elements){if(el.name)S.D.draft[el.name]=el.value;}}
function assetOpts(){return S.assets.slice().sort((a,b)=>String(a.nama).localeCompare(String(b.nama),'id')).map(a=>[a.id,a.nama]);}
function confirmBox(key,text,sub){return S.confirm===key?'<div class="confirm"><strong>'+text+'</strong><span>'+sub+'</span><div class="acts"><button class="btn danger" type="button" data-act="confirm-yes">Ya, hapus</button><button class="btn" type="button" data-act="confirm-no">Batal</button></div></div>':'';}

/* ================= Navigation ================= */
function setView(v){S.view=v;S.pick=false;renderPick();renderAll();if(v==='peta')setTimeout(()=>{map.invalidateSize();renderTints();},0);}
function openD(desc){S.confirm=null;S.D=desc;renderDrawer();drawPickMarker();}
function back(){S.confirm=null;S.pick=false;renderPick();if(S.D&&S.D.back){S.D=S.D.back;renderAll();renderDrawer();drawPickMarker();}else closeDrawer();}
function closeDrawer(){S.D=null;S.sel=null;S.pick=false;S.confirm=null;renderPick();renderAll();renderDrawer();drawPickMarker();}
function openAsset(id,fly,tab,fresh){
  S.sel=id;S.tab=tab||'info';S.pick=false;renderPick();
  openD({kind:'asset',id,fresh:!!fresh});renderSide();renderMarkers();
  const a=assetById(id);
  if(a&&fly&&S.view==='peta')map.flyTo([a.lat,a.lng],Math.max(map.getZoom(),7),{duration:reduced()?0:.8});
}
function cur(){return S.D&&S.D.kind==='asset'?S.D:null;}
function newAssetForm(a){S.pick=!a;renderPick();if(S.view!=='peta')setView('peta');openD({kind:'assetForm',back:cur()||(a?{kind:'asset',id:a.id}:null),draft:a?{...a}:{nama:'',kategori:'bangunan',kondisi:'baik',lat:'',lng:'',negara:'',wilayah:'',pengelola:'',pj:'',tahun:'',dimensi:'',keterangan:''}});}

/* ================= Offline storage (standalone file) ================= */
const LS_KEY='cis-data-v1';
function saveLocal(){if(!S.local||!window.CIS_STANDALONE)return;try{localStorage.setItem(LS_KEY,JSON.stringify({assets:S.assets,sensors:S.sensors,reports:S.reports,maint:S.maint,models:S.models}));}catch(e){toast('Browser menolak menyimpan data. Perubahan hanya bertahan sampai halaman ditutup.');}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(d&&Array.isArray(d.assets)){Object.keys(COLS).forEach(k=>S[k]=d[k]||[]);return true;}}catch(e){}return false;}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('cis-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbOp(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files',mode);const st=t.objectStore('files');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});}
const idbPut=(k,v)=>idbOp('readwrite',st=>st.put(v,k));
const idbGet=k=>idbOp('readonly',st=>st.get(k));
const idbDel=k=>idbOp('readwrite',st=>st.delete(k));
async function dropModelFile(m){if(!m||!m.blobId)return;if(m.blobId.indexOf('idb:')===0){try{await idbDel(m.blobId);}catch(e){}}else if(assetsCap&&m.blobId!=='sample'){try{await assetsCap.delete(m.blobId);}catch(e){}}}

/* ================= Data layer ================= */
async function put(kind,id,body){
  if(db){const ref=id?db.collection(COLS[kind]).doc(id):db.collection(COLS[kind]).doc();await ref.set(body);return ref.id;}
  id=id||kind[0]+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const arr=S[kind],i=arr.findIndex(x=>x.id===id),rec={id,...body};if(i>=0)arr[i]=rec;else arr.push(rec);saveLocal();renderAll();return id;
}
async function patch(kind,id,fields){
  if(db){await db.collection(COLS[kind]).doc(id).update(fields);return;}
  const r=S[kind].find(x=>x.id===id);if(r)Object.assign(r,fields);saveLocal();renderAll();
}
async function remove(kind,id){
  if(db){await db.collection(COLS[kind]).doc(id).delete();return;}
  S[kind]=S[kind].filter(x=>x.id!==id);saveLocal();renderAll();
}
function strip(o){const r={...o};delete r.id;return r;}
function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted')return 'Akses Anda tidak mengizinkan perubahan ini. Admin aset butuh akses Editor; pelapor butuh akses Contributor.';
  if(c==='quota_exceeded')return 'Kapasitas penyimpanan penuh. Hapus data yang tidak diperlukan terlebih dahulu.';
  return 'Gagal menyimpan. Periksa koneksi lalu coba lagi.';
}
function showErr(msg){const el=$('#fm-err');if(el){el.textContent=msg;el.hidden=false;}else toast(msg);}
async function guarded(btn,fn){if(btn)btn.disabled=true;try{await fn();}catch(e){showErr(writeErr(e));}finally{if(btn&&btn.isConnected)btn.disabled=false;}}

/* ================= Save handlers ================= */
async function save(btn){
  syncDraft();const D=S.D,d=D.draft,now=new Date().toISOString();
  const need=(c,m)=>{if(!c)throw {msgOnly:m};};
  try{
    if(D.kind==='assetForm'){
      const lat=num(d.lat),lng=num(d.lng);
      need(String(d.nama).trim(),'Isi nama aset.');
      need(lat!=null&&lat>=-90&&lat<=90,'Lintang harus angka antara -90 dan 90. Klik peta untuk mengisinya otomatis.');
      need(lng!=null&&lng>=-180&&lng<=180,'Bujur harus angka antara -180 dan 180.');
      need(!d.tahun||/^\d{4}$/.test(String(d.tahun).trim()),'Tahun operasi ditulis 4 digit, mis. 2009.');
      const body={...strip(d),nama:String(d.nama).trim(),lat:+lat.toFixed(6),lng:+lng.toFixed(6),negara:String(d.negara||'').trim()||countryAt(lat,lng),diperbarui:now};
      await guarded(btn,async()=>{const id=await put('assets',d.id,body);toast(d.id?'Perubahan disimpan':'Aset ditambahkan');S.pick=false;renderPick();openAsset(id,false,'info',true);});
    }
    else if(D.kind==='sensorForm'){
      need(d.assetId,'Pilih aset tempat sensor dipasang.');
      need(String(d.nama).trim(),'Isi nama atau kode sensor.');
      const t=STYPE[d.tipe]||STYPE.lainnya;
      if(t.k==='lainnya')need(String(d.tipeLain||'').trim(),'Isi nama jenis sensor.');
      if(!t.cam){need(d.min===''||num(d.min)!=null,'Ambang minimum harus angka.');need(d.max===''||num(d.max)!=null,'Ambang maksimum harus angka.');if(num(d.min)!=null&&num(d.max)!=null)need(num(d.min)<num(d.max),'Ambang minimum harus lebih kecil dari maksimum.');}
      if(t.cam&&d.streamUrl)need(/^https?:\/\//i.test(d.streamUrl),'Alamat siaran harus diawali http:// atau https://');
      const body={...strip(d),nama:String(d.nama).trim(),satuan:t.cam?'':(String(d.satuan||'').trim()||t.u),min:t.cam?null:num(d.min),max:t.cam?null:num(d.max),diperbarui:now};
      if(!d.id){body.riwayat=[];body.nilai=null;body.waktu=null;body.dibuat=now;}
      await guarded(btn,async()=>{await put('sensors',d.id,body);toast(d.id?'Sensor diperbarui':'Sensor terpasang');S.tab='sensor';back();});
    }
    else if(D.kind==='readingForm'){
      const v=num(d.nilai);need(v!=null,'Isi nilai berupa angka.');
      let t=now;if(String(d.waktu||'').trim()){const p=new Date(String(d.waktu).trim().replace(' ','T'));need(!isNaN(p),'Waktu tidak dikenali. Gunakan format 2026-09-29 08:30.');t=p.toISOString();}
      const s=S.sensors.find(x=>x.id===D.id);
      const hist=(s.riwayat||[]).concat([{t,v}]).sort((a,b)=>String(a.t).localeCompare(String(b.t))).slice(-60);
      const latest=hist[hist.length-1];
      await guarded(btn,async()=>{await patch('sensors',s.id,{riwayat:hist,nilai:latest.v,waktu:latest.t});const st=sStat({...s,nilai:latest.v});toast(st==='alert'?'Tersimpan. Nilai di luar ambang normal.':'Pembacaan tersimpan');back();});
    }
    else if(D.kind==='reportForm'){
      need(d.assetId,'Pilih aset yang mengalami gangguan.');
      need(String(d.judul).trim(),'Isi judul laporan.');
      const body={...strip(d),judul:String(d.judul).trim(),status:'baru',pelapor:S.me||null,dibuat:now,diperbarui:now,tindak:[]};
      await guarded(btn,async()=>{const id=await put('reports',null,body);toast('Laporan terkirim');S.D={kind:'report',id,back:D.back,fresh:true};renderAll();renderDrawer();});
    }
    else if(D.kind==='maintForm'){
      need(d.assetId,'Pilih aset.');need(String(d.judul).trim(),'Isi nama pekerjaan.');
      need(/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal||''),'Isi tanggal perawatan.');
      need(d.biaya===''||d.biaya==null||num(d.biaya)!=null,'Biaya harus angka, tanpa titik ribuan.');
      const body={...strip(d),judul:String(d.judul).trim(),biaya:num(d.biaya),diperbarui:now};
      if(!d.id)body.dibuat=now;
      await guarded(btn,async()=>{await put('maint',d.id,body);toast(d.id?'Catatan diperbarui':'Perawatan dicatat');back();});
    }
  }catch(e){if(e&&e.msgOnly)showErr(e.msgOnly);else showErr(writeErr(e));}
}
async function addStep(btn){
  const r=S.reports.find(x=>x.id===S.D.id);if(!r)return;
  const note=($('#fm-catatan')||{}).value||'';const st=$('#fm-status')?$('#fm-status').value:r.status;
  if(!note.trim()&&st===r.status){showErr('Tulis catatan atau ubah status.');return;}
  const now=new Date().toISOString();
  const step={t:now,oleh:S.me||null,catatan:note.trim()};if(st!==r.status)step.status=st;
  await guarded(btn,async()=>{await patch('reports',r.id,{tindak:(r.tindak||[]).concat([step]),status:st,diperbarui:now});const n=$('#fm-catatan');if(n)n.value='';renderDrawer();toast(st==='selesai'&&r.status!=='selesai'?'Laporan ditutup':'Tindak lanjut disimpan');});
}
async function doConfirm(btn){
  const D=S.D,k=S.confirm;S.confirm=null;
  await guarded(btn,async()=>{
    if(k==='asset'){
      const id=D.id;
      for(const s of S.sensors.filter(x=>x.assetId===id))await remove('sensors',s.id);
      for(const m of S.maint.filter(x=>x.assetId===id))await remove('maint',m.id);
      for(const r of S.reports.filter(x=>x.assetId===id))await remove('reports',r.id);
      for(const m of S.models.filter(x=>x.assetId===id)){await dropModelFile(m);await remove('models',m.id);}
      await remove('assets',id);toast('Aset dihapus');closeDrawer();
    } else if(k&&k.indexOf('model:')===0){const m=S.models.find(x=>x.id===k.slice(6));if(m){await dropModelFile(m);await remove('models',m.id);toast('Model dihapus');}renderDrawer();
    } else if(k==='sensor'){await remove('sensors',D.draft.id);toast('Sensor dihapus');S.tab='sensor';back();}
    else if(k==='maint'){await remove('maint',D.draft.id);toast('Catatan dihapus');back();}
    else if(k==='report'){await remove('reports',D.id);toast('Laporan dihapus');back();}
  });
}

  const csv=[cols.join(',')].concat(filteredAssets().map(a=>{const h=assetHealth(a.id);const r={...a,kategori:(CAT[a.kategori]||{}).n,kondisi:(COND[a.kondisi]||{}).n,sensor:h.sens,peringatan:h.alerts,laporan_terbuka:h.open};return cols.map(c=>q(r[c])).join(',');})).join('\n');

const IFC_MAX = 20*1024*1024;
const IFC_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
  'https://cdn.jsdelivr.net/npm/web-ifc@0.0.39/web-ifc-api-browser.js'
];
const IFC_NAMES = {IFCWALL:'Dinding',IFCWALLSTANDARDCASE:'Dinding',IFCSLAB:'Pelat lantai',IFCBEAM:'Balok',IFCCOLUMN:'Kolom',IFCDOOR:'Pintu',IFCWINDOW:'Jendela',
  IFCSTAIR:'Tangga',IFCSTAIRFLIGHT:'Anak tangga',IFCROOF:'Atap',IFCRAILING:'Railing',IFCFURNISHINGELEMENT:'Perabot',IFCPLATE:'Pelat',IFCMEMBER:'Rangka',
  IFCCOVERING:'Penutup',IFCSPACE:'Ruang',IFCBUILDINGELEMENTPROXY:'Elemen lain',IFCFOOTING:'Pondasi',IFCPILE:'Tiang pancang',IFCCURTAINWALL:'Dinding tirai',
  IFCFLOWSEGMENT:'Pipa / saluran',IFCFLOWTERMINAL:'Terminal utilitas',IFCFLOWFITTING:'Sambungan utilitas',IFCRAMP:'Ramp',IFCRAMPFLIGHT:'Ramp',
  IFCOPENINGELEMENT:'Bukaan',IFCSITE:'Tapak',IFCBUILDING:'Bangunan',IFCBUILDINGSTOREY:'Lantai',IFCREINFORCINGBAR:'Tulangan',IFCBRIDGE:'Jembatan',IFCROAD:'Jalan'};
const HIDDEN_BY_DEFAULT = new Set(['IFCSPACE','IFCOPENINGELEMENT']);
function fmtBytes(n){n=+n||0;return n<1024*1024?(n/1024).toFixed(0)+' KB':(n/1024/1024).toFixed(1).replace('.',',')+' MB';}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Pustaka '+src.split('/').pop()+' gagal diunduh.'));document.head.appendChild(s);});}
let libsP=null, ifcApi=null;
function loadIfcLibs(){
  if(!libsP)libsP=(async()=>{for(const u of IFC_LIBS)await loadScript(u);if(!window.WebIFC||!window.THREE||!THREE.OrbitControls)throw new Error('Pustaka 3D tidak lengkap.');})().catch(e=>{libsP=null;throw e;});
  return libsP;
}
async function getIfcApi(){
  if(ifcApi)return ifcApi;
  const api=new WebIFC.IfcAPI();
  api.SetWasmPath(window.CIS_STANDALONE?'https://cdn.jsdelivr.net/npm/web-ifc@0.0.39/':new URL('./',document.baseURI).href,true);
  try{await api.Init();}catch(e){throw new Error('Mesin pembaca IFC tidak dapat dijalankan di tampilan ini ('+(e&&e.message||e)+').');}
  ifcApi=api;return api;
}
/* Header facts read straight from the STEP text: schema, and IfcSite RefLatitude/RefLongitude. */
function ifcTextMeta(text){
  const meta={};
  const sm=/FILE_SCHEMA\s*\(\s*\(\s*'([^']+)'/i.exec(text.slice(0,20000));if(sm)meta.skema=sm[1].toUpperCase();
  const site=/=\s*IFCSITE\s*\(([\s\S]*?)\)\s*;/i.exec(text);
  if(site){
    const lists=[...site[1].matchAll(/\(\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)(?:\s*,\s*(-?\d+))?\s*\)/g)];
    if(lists.length>=2){
      const dd=m=>(+m[1])+(+m[2])/60+((+m[3])+(+(m[4]||0))/1e6)/3600;
      const lat=dd(lists[0]),lng=dd(lists[1]);
      if(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180&&!(lat===0&&lng===0)){meta.lat=+lat.toFixed(6);meta.lng=+lng.toFixed(6);}
    }
  }
  return meta;
}

    confirmBox('model:'+m.id,'Hapus model “'+esc(m.nama)+'”?','File IFC ini akan dihapus dari registri untuk semua pengguna.')+

  h+='<p class="err" id="fm-err" hidden></p><p class="help" id="ifc-progress" hidden></p>';

async function uploadIfc(file,assetId){
  const prog=$('#ifc-progress'),say=t=>{if(prog){prog.textContent=t;prog.hidden=!t;}};
  if(!assetsCap&&!window.CIS_STANDALONE){showErr('Unggah file tidak tersedia di tampilan ini.');return;}
  if(!/\.ifc$/i.test(file.name)){showErr('Pilih file berakhiran .ifc.');return;}
  if(file.size>IFC_MAX){showErr('Ukuran file maksimal 20 MB. File ini '+fmtBytes(file.size)+'. Kecilkan model (mis. ekspor per lantai atau per disiplin) lalu coba lagi.');return;}
  say('Memeriksa file…');
  const bytes=new Uint8Array(await file.arrayBuffer());
  if(!/ISO-10303-21/.test(new TextDecoder().decode(bytes.slice(0,200)))){say('');showErr('File ini bukan IFC berformat STEP (.ifc). File .ifcxml atau .ifczip belum didukung.');return;}
  let text,blob=file,converted=false;
  try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(e){text=new TextDecoder('windows-1252').decode(bytes);blob=new Blob([text],{type:'text/plain'});converted=true;}
  const meta=ifcTextMeta(text);
  say('Mengunggah '+fmtBytes(file.size)+'…');
  try{
    const up=assetsCap?await assetsCap.upload(blob,{type:'text/plain'}):await (async()=>{const k='idb:'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await idbPut(k,blob);return {id:k,url:'',sizeBytes:blob.size};})();
    const body={assetId,nama:file.name,blobId:up.id,url:up.url,ukuran:up.sizeBytes||file.size,skema:meta.skema||'',diunggah:new Date().toISOString(),oleh:S.me||null};
    if(meta.lat!=null){body.lat=meta.lat;body.lng=meta.lng;}
    await put('models',null,body);
    say('');toast(converted?'Model diunggah (karakter teks diubah ke UTF-8)':'Model 3D diunggah');
  }catch(e){
    say('');const c=e&&e.code;
    showErr(c==='too_large'?'File terlalu besar untuk disimpan. Maksimal 20 MB.':c==='unsupported_type'?'Penyimpanan menolak file ini. Pastikan file IFC berupa teks STEP biasa.':c==='quota_or_state'?'Kuota penyimpanan file sudah penuh. Hapus model lama terlebih dahulu.':writeErr(e));
  }
}

const V={};
function vStatus(title,sub,isErr){const st=$('#vstatus');if(!st)return;st.hidden=!title;st.innerHTML=title?'<div><b>'+esc(title)+'</b>'+(sub?'<span'+(isErr?' class="c-bad"':'')+'>'+esc(sub)+'</span>':'')+'</div>':'';}
async function openViewer(opt){

  try{

function buildScene(api,buf){
  const text=new TextDecoder('windows-1252').decode(buf);
  V.meta=Object.assign(ifcTextMeta(text),V.opt.meta||{});
  const modelID=api.OpenModel(buf);V.api=api;V.modelID=modelID;
  const stage=$('#stage');
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45,1,0.05,50000);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  stage.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x5f6f78,0.95));
  const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(1,2,1.4);scene.add(dl);
  const group=new THREE.Group();scene.add(group);
  const mats=new Map(),byType=new Map(),byEid=new Map();
  api.StreamAllMeshes(modelID,m=>{
    const eid=m.expressID;let tname='LAINNYA';
    try{tname=api.GetNameFromTypeCode(api.GetLineType(modelID,eid))||tname;}catch(e){}
    const pgs=m.geometries;
    for(let i=0;i<pgs.size();i++){
      const p=pgs.get(i),g=api.GetGeometry(modelID,p.geometryExpressID);
      const v=api.GetVertexArray(g.GetVertexData(),g.GetVertexDataSize());
      const ix=api.GetIndexArray(g.GetIndexData(),g.GetIndexDataSize());
      if(!v.length||!ix.length)continue;
      const n=v.length/6,pos=new Float32Array(n*3),nor=new Float32Array(n*3);

  Object.assign(V,{scene,cam,renderer,controls,group,byType,byEid,hl,sel:null});
  const resize=()=>{const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};

    if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;down=null;

function fitView(){
  if(!V.group)return;
  const vis=new THREE.Box3();V.group.children.forEach(o=>{if(o.visible)vis.expandByObject(o);});
  const box=vis.isEmpty()?new THREE.Box3().setFromObject(V.group):vis;
  const size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
  const r=Math.max(size.x,size.y,size.z)||10,d=r*1.35;
  V.cam.near=Math.max(0.01,r/1000);V.cam.far=r*100;V.cam.updateProjectionMatrix();
  V.cam.position.set(ctr.x+d*.8,ctr.y+d*.6,ctr.z+d*.8);V.controls.target.copy(ctr);V.controls.update();

    try{const ps=api.GetLine(id,pid);const props=[];
      (ps.HasProperties||[]).slice(0,40).forEach(h=>{try{const pr=api.GetLine(id,h.value);props.push([ifcVal(pr.Name),ifcVal(pr.NominalValue)]);}catch(e){}});

    if(window.CIS_STANDALONE){if(!loadLocal()&&window.CIS_SEED){Object.keys(COLS).forEach(k=>S[k]=(window.CIS_SEED[k]||[]).map(x=>({...x})));saveLocal();}
      renderAll();return;}
    showNotice('Tampilan ini tidak terhubung ke penyimpanan registri, jadi aset tersimpan tidak bisa ditampilkan. Buka halaman dari aplikasi Claude atau claude.ai, bukan tab browser terpisah.');
    renderAll();return;
  }
  const pending=new Set(Object.keys(COLS));
  Object.entries(COLS).forEach(([k,path])=>{
    db.collection(path).onSnapshot(snap=>{
      S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));
      pending.delete(k);if(!pending.size)S.loaded=true;
      if(S.sel&&!assetById(S.sel)&&S.loaded){S.sel=null;if(S.D&&S.D.kind==='asset')S.D=null;renderDrawer();}
      renderAll();
    },err=>{
      pending.delete(k);S.loaded=true;
      showNotice(err&&err.code==='revoked'?'Akses ke registri telah berubah. Muat ulang halaman.':'Sebagian data tidak dapat dimuat. Muat ulang halaman untuk mencoba lagi.');
      renderAll();
    });
  });
})();
})();
</script>
